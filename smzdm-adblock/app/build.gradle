plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostroot.smzdmadblock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghostroot.smzdmadblock'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // libxposed API 102, bundled locally so the build works offline.
    compileOnly files('libs/api-102.0.0.aar')
}
